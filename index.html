<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Antrenman Takip</title>
<style>
  :root{
    --bg:#0f1115;--card:#1a1d24;--card2:#20242c;--accent:#3ddc84;--accent2:#4f8cff;
    --text:#eef0f3;--muted:#8a8f99;--danger:#ff5d5d;--border:#2a2e38;
    --isınma:#4f8cff;--çalışma:#3ddc84;--drop:#ffb547;--restpause:#c084fc;--ekset:#fb923c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px;}
  header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:10;border-bottom:1px solid var(--border);}
  h1{font-size:18px;margin:0 0 10px;}
  .nav{display:flex;gap:6px;}
  .navbtn{flex:1;padding:10px;border-radius:10px;background:var(--card2);color:var(--muted);text-align:center;font-size:13px;font-weight:600;}
  .navbtn.active{background:var(--accent2);color:#fff;}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--card2);color:var(--muted);font-size:13px;font-weight:600;}
  .tab.active{background:var(--accent);color:#04140a;}
  main{padding:12px 16px;}
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .datebar input[type=date]{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:8px;font-size:14px;}
  .editbadge{font-size:11px;color:var(--accent);background:rgba(61,220,132,.12);padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .daymeta{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .exname{font-weight:700;font-size:15px;}
  .extag{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .target{font-size:11px;color:var(--accent);margin-bottom:10px;}
  /* set list */
  .setlist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
  .setrow{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:8px;padding:6px 8px;}
  .settype{font-size:11px;font-weight:700;min-width:68px;padding:2px 6px;border-radius:4px;text-align:center;}
  .settype.isınma{background:rgba(79,140,255,.18);color:var(--isınma);}
  .settype.çalışma{background:rgba(61,220,132,.18);color:var(--çalışma);}
  .settype.drop{background:rgba(255,181,71,.18);color:var(--drop);}
  .settype.restpause{background:rgba(192,132,252,.18);color:var(--restpause);}
  .settype.ekset{background:rgba(251,146,60,.18);color:var(--ekset);}
  .setvals{flex:1;font-size:13px;color:var(--text);}
  .delbtn{color:var(--danger);font-size:16px;background:none;border:none;padding:0 2px;line-height:1;}
  /* add row */
  .addrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center;}
  .addrow input{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:14px;width:100%;}
  .addrow select{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 4px;border-radius:8px;font-size:13px;width:100%;appearance:none;-webkit-appearance:none;}
  .addbtn{background:var(--accent);color:#04140a;border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap;}
  .addlabels{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-bottom:4px;}
  .addlabels span{font-size:10px;color:var(--muted);}
  /* last session hint */
  .lasthint{font-size:11px;color:var(--muted);margin-bottom:8px;border-top:1px solid var(--border);padding-top:8px;}
  /* note */
  textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:13px;min-height:50px;font-family:inherit;}
  /* savebar */
  .savebar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;}
  button.primary{flex:1;background:var(--accent);color:#04140a;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;}
  button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:13px;font-size:14px;font-weight:600;}
  /* history */
  .histitem{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
  .histhead{display:flex;justify-content:space-between;align-items:center;}
  .histday{font-size:14px;font-weight:700;color:var(--accent2);}
  .histdate{color:var(--muted);font-size:12px;}
  .histex{margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
  .histexname{font-size:13px;font-weight:600;margin-bottom:3px;}
  .histsets{display:flex;flex-wrap:wrap;gap:4px;}
  .histsetpill{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--card2);color:var(--muted);}
  .histsetpill.çalışma{background:rgba(61,220,132,.12);color:var(--çalışma);}
  .histsetpill.drop{background:rgba(255,181,71,.12);color:var(--drop);}
  .histnote{font-size:12px;color:var(--muted);margin-top:6px;}
  .histdel{color:var(--danger);font-size:12px;background:none;border:none;padding:4px;margin-top:6px;float:right;}
  .toolsrow{display:flex;gap:8px;margin-bottom:14px;}
  .toolsrow button{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:13px;font-weight:600;}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px;}
</style>
</head>
<body>

<header>
  <h1>🏋️ Antrenman Takip</h1>
  <div class="nav">
    <div class="navbtn active" id="navLog" onclick="setView('log')">Bugünkü Antrenman</div>
    <div class="navbtn" id="navHist" onclick="setView('hist')">Geçmiş</div>
  </div>
  <div class="tabs" id="dayTabs"></div>
</header>

<main id="main"></main>

<div class="savebar" id="saveBar">
  <button class="secondary" onclick="exportData()">Dışa Aktar</button>
  <button class="primary" onclick="saveSession()">Kaydet</button>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">

<script>
const PROGRAM = {
  push: { label:"Push", tag:"Göğüs / Omuz / Triceps", exercises:[
    {name:"Vertical Chest Press",       tag:"bileşik · göğüs",         target:"70 kg"},
    {name:"Deltoid Press",              tag:"bileşik · omuz",           target:"55 kg"},
    {name:"Incline Press (Smith)",      tag:"üst göğüs",                target:"tespit"},
    {name:"Cable Lateral Raise",        tag:"yan deltoid",              target:"tespit"},
    {name:"Triceps Pushdown",           tag:"triceps",                  target:"mevcut kademe"},
    {name:"EZ Skullcrusher",            tag:"triceps uzun baş",         target:"tespit"},
    {name:"Chest Fly (Multi Flight)",   tag:"göğüs izolasyon",          target:"tespit"},
  ]},
  pull: { label:"Pull", tag:"Sırt / Biceps / Arka Omuz", exercises:[
    {name:"Lat Pulldown",               tag:"dikey çekiş · bileşik",    target:"80 kg"},
    {name:"Pulley Row",                 tag:"yatay çekiş · bileşik",    target:"65 kg"},
    {name:"Super Power Row",            tag:"sırt kalınlığı",           target:"tespit"},
    {name:"Pullover Machine",           tag:"lat izolasyon",            target:"tespit"},
    {name:"Face Pull",                  tag:"arka omuz · sağlık",       target:"50 kg"},
    {name:"Dumbbell Incline Curl",      tag:"biceps",                   target:"tespit"},
    {name:"Hammer Curl",                tag:"brachialis · ön kol",      target:"tespit"},
  ]},
  leg: { label:"Leg", tag:"Bacak Komple", exercises:[
    {name:"Hack Squat",                 tag:"quad · bileşik",           target:"55 kg"},
    {name:"Horizontal Leg Press",       tag:"quad/glute · bileşik",     target:"130 kg"},
    {name:"RDL",                        tag:"hamstring · teknik/ROM",   target:"60 kg"},
    {name:"Leg Curling (oturarak)",     tag:"hamstring",                target:"35 kg"},
    {name:"Leg Extension",              tag:"quad izolasyon",           target:"55 kg"},
    {name:"Seated Calf",                tag:"baldır",                   target:"55 kg"},
    {name:"Abdominal Crunch",           tag:"karın",                    target:"tespit"},
  ]},
  upper: { label:"Upper", tag:"Üst Gövde (farklı açılar)", exercises:[
    {name:"Super Vertical Chest Press", tag:"göğüs · farklı açı",       target:"tespit"},
    {name:"Nötr Tutuş Lat Pulldown",    tag:"dikey çekiş",              target:"tespit"},
    {name:"Super Deltoid Press",        tag:"omuz · farklı uyaran",     target:"tespit"},
    {name:"T-Bar Row",                  tag:"sırt · farklı açı",        target:"tespit"},
    {name:"Chest Fly (Pec Back)",       tag:"göğüs izolasyon",          target:"45 kg"},
    {name:"Preacher Curl (EZ bar)",     tag:"biceps",                   target:"tespit"},
    {name:"Alternate Triceps Machine",  tag:"triceps",                  target:"tespit"},
    {name:"Wrist Curl",                 tag:"ön kol",                   target:"18 kg"},
  ]},
  lower: { label:"Lower", tag:"Alt Gövde (posterior/glute)", exercises:[
    {name:"Super Leg Press 45°",        tag:"quad · bileşik",           target:"tespit"},
    {name:"Hip Thrust",                 tag:"glute · bileşik",          target:"70 kg"},
    {name:"Leg Curling (oturarak)",     tag:"hamstring 2. uyaran",      target:"35 kg"},
    {name:"Leg Extension",              tag:"quad izolasyon",           target:"55 kg"},
    {name:"Standing Abductor",          tag:"glute medius",             target:"tespit"},
    {name:"Seated Calf",                tag:"baldır 2. uyaran",         target:"55 kg"},
    {name:"Bulgar Split Squat",         tag:"tek bacak · Hyrox",        target:"tespit"},
  ]},
};

const TYPE_LABELS = {
  "ısınma":    {css:"isınma",    label:"Isınma"},
  "çalışma":   {css:"çalışma",   label:"Çalışma"},
  "drop":      {css:"drop",      label:"Drop"},
  "rest-pause":{css:"restpause", label:"Rest-Pause"},
  "+1 set":    {css:"ekset",     label:"+1 Set"},
};

const STORAGE_KEY = "antrenman_takip_v2";
let state = { view:"log", day:"push", history:[], logDate: new Date().toISOString().slice(0,10) };
let currentSets = {};
let currentNote = "";

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.history = JSON.parse(raw);
    // migrate v1 data
    const rawV1 = localStorage.getItem("antrenman_takip_v1");
    if (rawV1 && state.history.length === 0) {
      const v1 = JSON.parse(rawV1);
      v1.forEach(s => {
        const migrated = { id:s.id, day:s.day, date:s.date, note:s.note||"", exercises:{} };
        (s.exercises||[]).forEach(ex => {
          const sets = [];
          if (ex.set1w||ex.set1r) sets.push({w:ex.set1w||"",r:ex.set1r||"",type:"çalışma"});
          if (ex.set2w||ex.set2r) sets.push({w:ex.set2w||"",r:ex.set2r||"",type:"çalışma"});
          if (ex.dropw||ex.dropr) sets.push({w:ex.dropw||"",r:ex.dropr||"",type:"drop"});
          if (sets.length) migrated.exercises[ex.name] = sets;
        });
        state.history.push(migrated);
      });
      persist();
    }
  } catch(e) { console.error(e); }
}
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
}
function todayStr() {
  return new Date().toISOString().slice(0,10);
}
function findSession(dayKey, date) {
  return state.history.find(s => s.day===dayKey && s.date===date) || null;
}
function lastSessionFor(dayKey, beforeDate) {
  for (let i=state.history.length-1; i>=0; i--) {
    const s = state.history[i];
    if (s.day===dayKey && (!beforeDate || s.date < beforeDate)) return s;
  }
  return null;
}
function initCurrentSets(dayKey, date) {
  currentSets = {};
  currentNote = "";
  const existing = findSession(dayKey, date);
  if (existing) {
    currentNote = existing.note || "";
    PROGRAM[dayKey].exercises.forEach(ex => {
      currentSets[ex.name] = existing.exercises && existing.exercises[ex.name]
        ? existing.exercises[ex.name].map(s=>({...s}))
        : [];
    });
  } else {
    PROGRAM[dayKey].exercises.forEach(ex => { currentSets[ex.name] = []; });
  }
}

function setView(v) {
  state.view = v;
  document.getElementById('navLog').classList.toggle('active', v==='log');
  document.getElementById('navHist').classList.toggle('active', v==='hist');
  document.getElementById('saveBar').style.display = v==='log' ? 'flex' : 'none';
  render();
}

function setDay(d) {
  state.day = d;
  initCurrentSets(d, state.logDate);
  render();
}

function onDateChange(val) {
  state.logDate = val;
  initCurrentSets(state.day, val);
  render();
}

function addSet(idx) {
  const exName = PROGRAM[state.day].exercises[idx].name;
  const w = document.getElementById('inp_w_' + idx).value.trim();
  const r = document.getElementById('inp_r_' + idx).value.trim();
  const type = document.getElementById('inp_t_' + idx).value;
  if (!w && !r) return;
  currentSets[exName].push({w, r, type});
  document.getElementById('inp_w_' + idx).value = '';
  document.getElementById('inp_r_' + idx).value = '';
  renderExCard(idx);
}

function removeSet(idx, setIdx) {
  const exName = PROGRAM[state.day].exercises[idx].name;
  currentSets[exName].splice(setIdx, 1);
  renderExCard(idx);
}

function renderExCard(idx) {
  const exName = PROGRAM[state.day].exercises[idx].name;
  const el = document.getElementById('excard_' + idx);
  if (!el) return;
  const sets = currentSets[exName] || [];
  let html = '';
  if (sets.length) {
    html = '<div class="setlist">';
    sets.forEach((s, i) => {
      const t = TYPE_LABELS[s.type] || {css:"çalışma", label:s.type};
      html += `<div class="setrow">
        <span class="settype ${t.css}">${t.label}</span>
        <span class="setvals">${s.w ? s.w+'kg' : '—'} × ${s.r || '—'}</span>
        <button class="delbtn" onclick="removeSet(${idx}, ${i})">×</button>
      </div>`;
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

function renderLog() {
  const day = PROGRAM[state.day];
  const date = state.logDate;
  const existing = findSession(state.day, date);
  const last = lastSessionFor(state.day, date);

  renderTabs();

  let html = `<div class="datebar">
    <input type="date" id="sessDate" value="${date}" onchange="onDateChange(this.value)">
    ${existing ? '<span class="editbadge">✏️ Düzenleniyor</span>' : ''}
  </div>
  <div class="daymeta">${day.tag} · ${day.exercises.length} hareket</div>`;

  day.exercises.forEach((ex, idx) => {
    const lastEx = last && last.exercises && last.exercises[ex.name];
    const lastInfo = lastEx && lastEx.length
      ? lastEx.filter(s=>s.type==='çalışma'||s.type==='+1 set').map(s=>`${s.w||'?'}kg×${s.r||'?'}`).join(' / ') || '—'
      : null;
    html += `<div class="card">
      <div class="exname">${ex.name}</div>
      <div class="extag">${ex.tag}</div>
      <div class="target">Hedef: ${ex.target}${lastInfo ? ' &nbsp;·&nbsp; Son: '+lastInfo : ''}</div>
      <div id="excard_${idx}"></div>
      <div class="addlabels"><span>kg</span><span>tekrar</span><span>tür</span><span></span></div>
      <div class="addrow">
        <input type="number" inputmode="decimal" id="inp_w_${idx}" placeholder="kg">
        <input type="number" inputmode="numeric" id="inp_r_${idx}" placeholder="tekrar">
        <select id="inp_t_${idx}">
          <option value="ısınma">Isınma</option>
          <option value="çalışma" selected>Çalışma</option>
          <option value="drop">Drop</option>
          <option value="rest-pause">Rest-Pause</option>
          <option value="+1 set">+1 Set</option>
        </select>
        <button class="addbtn" onclick="addSet(${idx})">Ekle</button>
      </div>
    </div>`;
  });

  html += `<div class="card">
    <div class="exname" style="margin-bottom:8px">Genel Not</div>
    <textarea id="sessNote" placeholder="Enerji, uyku, vücut ağırlığı, sakatlık hissi vb.">${currentNote}</textarea>
  </div>`;

  document.getElementById('main').innerHTML = html;
  day.exercises.forEach((ex, idx) => renderExCard(idx));
}

function renderTabs() {
  document.getElementById('dayTabs').innerHTML = Object.keys(PROGRAM).map(k =>
    `<div class="tab ${k===state.day?'active':''}" onclick="setDay('${k}')">${PROGRAM[k].label}</div>`
  ).join('');
}

function renderHist() {
  renderTabs();
  if (state.history.length === 0) {
    document.getElementById('main').innerHTML = `<div class="empty">Henüz antrenman kaydı yok.</div>
    <div class="toolsrow">
      <button onclick="document.getElementById('importFile').click()">İçe Aktar</button>
      <button onclick="exportData()">Dışa Aktar</button>
    </div>`;
    return;
  }
  const sorted = [...state.history].sort((a,b)=>b.date.localeCompare(a.date));
  let html = `<div class="toolsrow">
    <button onclick="document.getElementById('importFile').click()">İçe Aktar</button>
    <button onclick="exportData()">Dışa Aktar</button>
  </div>`;
  sorted.forEach(s => {
    const dayLabel = PROGRAM[s.day]?.label || s.day;
    html += `<div class="histitem">
      <div class="histhead">
        <span class="histday">${dayLabel}</span>
        <span class="histdate">${s.date}</span>
      </div>`;
    const exObj = s.exercises || {};
    Object.entries(exObj).forEach(([name, sets]) => {
      if (!sets || !sets.length) return;
      html += `<div class="histex">
        <div class="histexname">${name}</div>
        <div class="histsets">`;
      sets.forEach(set => {
        const t = TYPE_LABELS[set.type] || {css:"çalışma",label:set.type};
        html += `<span class="histsetpill ${t.css}">${t.label} ${set.w||'?'}kg×${set.r||'?'}</span>`;
      });
      html += `</div></div>`;
    });
    if (s.note) html += `<div class="histnote">📝 ${s.note}</div>`;
    html += `<button class="histdel" onclick="deleteSession('${s.id}')">Sil</button>`;
    html += `<div style="clear:both"></div></div>`;
  });
  document.getElementById('main').innerHTML = html;
}

function render() {
  if (state.view === 'log') renderLog();
  else renderHist();
}

function saveSession() {
  const day = PROGRAM[state.day];
  const date = state.logDate;
  const note = document.getElementById('sessNote')?.value || '';

  const exercises = {};
  day.exercises.forEach(ex => {
    if (currentSets[ex.name] && currentSets[ex.name].length)
      exercises[ex.name] = currentSets[ex.name];
  });

  const existing = findSession(state.day, date);
  if (existing) {
    existing.exercises = exercises;
    existing.note = note;
  } else {
    const id = state.day + '_' + date + '_' + Date.now();
    state.history.push({id, day:state.day, date, exercises, note});
  }
  persist();
  initCurrentSets(state.day, todayStr());
  setView('hist');
}

function deleteSession(id) {
  if (!confirm('Bu kayıt silinsin mi?')) return;
  state.history = state.history.filter(s => s.id !== id);
  persist();
  render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(state.history, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `antrenman_yedek_${todayStr()}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('Geçersiz format');
      state.history = data;
      persist();
      render();
      alert('İçe aktarma tamamlandı.');
    } catch(err) { alert('Hata: ' + err.message); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

load();
initCurrentSets(state.day, todayStr());
render();
</script>
</body>
</html>
